<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동국대 서비스 상태</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><style>
*{box-sizing:border-box}html{scrollbar-gutter:stable}body{line-height:1.5}button{font:inherit;font-size:13px}.row{min-height:24px}.meta{min-height:18px;font-variant-numeric:tabular-nums}.meta span:last-child{text-align:right}.state{white-space:nowrap}#incidents{min-height:56px}.overall{min-height:70px}body{margin:0;background:#fafaf8;color:#242623;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}main{max-width:850px;margin:auto;padding:62px 24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e6e0;padding-bottom:28px}.brand{font-weight:750;letter-spacing:-.04em;font-size:21px}.tag{color:#787d73;font-size:13px}h1{font-size:38px;letter-spacing:-.05em;margin:64px 0 12px}.intro{color:#747a70;line-height:1.6}.overall{margin:38px 0 48px;border:1px solid #cbe7d8;background:#eaf8ef;border-radius:9px;padding:22px;font-weight:700;color:#176c44}.overall.warning{background:#fff7e9;border-color:#f1dfba;color:#875d0e}.overall.down{background:#fdf0ee;border-color:#f1d2cd;color:#ae4538}h2{font-size:19px;margin:0}.section{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.tabs{display:flex;gap:4px;background:#eeeeea;border-radius:7px;padding:3px}.tabs button{border:0;background:transparent;padding:7px 11px;color:#666;cursor:pointer;border-radius:5px}.tabs button.active{background:white;color:#222;box-shadow:0 1px 3px #0002}.card{border:1px solid #e4e7df;border-radius:10px;background:white;padding:23px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.name{font-weight:700}.state{font-size:13px;color:#258452}.state.down{color:#b84b3e}.state.checking,.state.unknown{color:#9b7c35}.bars{display:flex;gap:3px;margin-top:23px;height:30px}.bar{flex:1;min-width:0;background:#e7eae4;border-radius:2px}.bar.up{background:#5fb788}.bar.down{background:#da7869}.bar.partial{background:#e8ba60}.meta{display:flex;justify-content:space-between;color:#92978e;font-size:12px;margin-top:10px}.incidents{margin-top:50px}.incident{padding:18px 0;border-bottom:1px solid #e5e6e0;font-size:14px;line-height:1.8}.muted{color:#858b80;font-size:13px}footer{border-top:1px solid #e5e6e0;margin-top:55px;padding-top:24px;font-size:12px;color:#858b80;line-height:1.8}@media(max-width:500px){main{padding:35px 18px}h1{font-size:31px;margin-top:48px}.tag{font-size:11px}}
.bar:hover,.bar:focus-visible{outline:2px solid #476454;outline-offset:2px}.graph-tooltip{position:fixed;left:0;top:0;z-index:1000;max-width:calc(100vw - 16px);padding:8px 11px;border-radius:7px;background:#242623;color:#fff;font-size:12px;line-height:1.6;white-space:pre-line;max-height:calc(100vh - 16px);overflow:auto;overscroll-behavior:contain;box-shadow:0 3px 12px #0002;pointer-events:auto}.graph-tooltip[hidden]{display:none}
</style><main><header><div class="brand">우리 서버 정상영업 하나요</div></header><div class="overall warning" id="overall">상태를 확인하고 있어요</div><div class="section"><h2>시스템 상태</h2><div class="tabs" aria-label="조회 기간"><button id="hour" class="active" onclick="setRange(1)">1시간</button><button id="day" onclick="setRange(24)">24시간</button><button id="week" onclick="setRange(168)">7일</button></div></div><p class="muted" id="interval-note">막대 한 칸 = 1분 · 최근 1시간</p><div id="services"><article class="card" aria-busy="true"><div class="row"><span class="name">포트 101</span><span class="state unknown">● 확인 중</span></div><div class="bars" aria-label="기록을 불러오는 중"></div><div class="meta"><span>60분 전</span><span>기록 수집 중 · 현재</span></div><div class="meta"><span>최근 확인: 불러오는 중</span><span></span></div></article><article class="card" aria-busy="true"><div class="row"><span class="name">포트 102</span><span class="state unknown">● 확인 중</span></div><div class="bars" aria-label="기록을 불러오는 중"></div><div class="meta"><span>60분 전</span><span>기록 수집 중 · 현재</span></div><div class="meta"><span>최근 확인: 불러오는 중</span><span></span></div></article><article class="card" aria-busy="true"><div class="row"><span class="name">이클래스</span><span class="state unknown">● 확인 중</span></div><div class="bars" aria-label="기록을 불러오는 중"></div><div class="meta"><span>60분 전</span><span>기록 수집 중 · 현재</span></div><div class="meta"><span>최근 확인: 불러오는 중</span><span></span></div></article></div><section class="incidents"><h2>최근 장애 이력</h2><div id="incidents" class="muted"><p>기록을 불러오는 중</p></div></section></main><div id="graph-tooltip" class="graph-tooltip" role="tooltip" hidden></div><script>
const label={up:'정상 운영',down:'접속 장애',checking:'확인 중',unknown:'상태 확인 불가'};let hours=1, data=null, connected=false, loading=false; const fmt=t=>new Date(t*1000).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
function percent(ok,count){return (ok===count?100:Math.min(99.99,Math.round(ok/count*10000)/100)).toFixed(2)}
const tooltipDateFormat=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function tooltipDate(t){
 const p=Object.fromEntries(tooltipDateFormat.formatToParts(new Date(t*1000)).map(x=>[x.type,x.value]));
 return {day:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}`,full:`${p.month}. ${p.day}. ${p.hour}:${p.minute}`};
}
function issueTimeRange(from,to){const a=tooltipDate(from),b=tooltipDate(to);return `${a.full} ~ ${a.day===b.day?b.time:b.full}`}
function barDescription(view,i,start,step,count,ok,gaps){
 const lines=[`${tooltipDate(start+i*step).full} ~ ${tooltipDate(start+(i+1)*step).full}`,!count?'기록 없음':`${percent(ok,count)}% 성공`];
 if(gaps)lines.push('일부 시간은 기록이 없어 상태를 알 수 없어요');
 const issue=view.issues?.[i];
 for(const [from,to,state] of issue?.ranges||[]){
  lines.push(state==='recovered'?`${issueTimeRange(from,to)} 동안 접속 이상 확인`:state==='open'?`${tooltipDate(from).full}부터 접속 이상 확인 · 정상 확인 대기`:`${issueTimeRange(from,to)} 접속 이상 확인 · 이후 기록 공백`);
 }
 if(issue?.more)lines.push(`외 ${issue.more}개 이상 구간`);
 return lines.join('\n');
}
function setRange(n){hours=n;document.querySelector('#hour').classList.toggle('active',n===1);document.querySelector('#day').classList.toggle('active',n===24);document.querySelector('#week').classList.toggle('active',n===168);document.querySelector('#interval-note').textContent=n===1?'막대 한 칸 = 1분 · 최근 1시간':n===24?'막대 한 칸 = 1시간 · 최근 24시간':'막대 한 칸 = 4시간 · 최근 7일';if(data)render()}
function render(){
 const active=document.activeElement;
 const focus=active?.matches('.bar')?{service:active.closest('.card').dataset.service,index:Array.from(active.parentElement.children).indexOf(active),tooltipVisible:!tooltip.hidden}:null;
 hideTooltip();const now=data.generated,states=data.services.map(s=>s.state),o=document.querySelector('#overall');o.className='overall '+(!connected?'warning':states.includes('down')?'down':states.every(x=>x==='up')?'':'warning');o.textContent=!connected?'상태 정보를 불러올 수 없어요':states.includes('down')?'일부 서비스에 접속 장애가 있어요':states.every(x=>x==='up')?'모든 서비스에 접속할 수 있어요':'일부 서비스의 상태를 확인하고 있어요';document.querySelector('#services').innerHTML=data.services.map(s=>{let view=s.views[String(hours)],n=view.bars.length,step=hours*3600/n,start=now-hours*3600;let bars=view.bars.map(([count,ok,gaps],i)=>{let cls=!count||gaps?'':ok===count?'up':ok===0?'down':'partial';return `<span class="bar ${cls}" role="img" tabindex="${i===0?0:-1}" aria-label="${barDescription(view,i,start,step,count,ok,gaps)}"></span>`}).join('');return `<article class="card" data-service="${s.id}"><div class="row"><span class="name">${s.name}</span><span class="state ${s.state}">● ${label[s.state]}</span></div><div class="bars" aria-label="구간별 접속 성공 기록">${bars}</div><div class="meta"><span>${hours===1?'60분':hours===24?'24시간':'7일'} 전</span><span>${view.success!==null?view.success.toFixed(2)+'% 성공':'기록 수집 중'} · 현재</span></div><div class="meta"><span>최근 확인: ${s.last?fmt(s.last):'기록 없음'}</span><span>${s.ms!=null?s.ms+' ms':''}</span></div></article>`}).join('');document.querySelector('#incidents').innerHTML=data.incidents.length?data.incidents.map(i=>`<div class="incident"><strong>${i.name}</strong> · ${i.ended?'복구됨':'장애 진행 중'}<br><span class="muted">${fmt(i.started)} ~ ${i.ended?fmt(i.ended):'현재'}</span></div>`).join(''):'<p>최근 7일 동안 감지된 장애가 없어요.</p>';
 if(focus){
  const card=Array.from(document.querySelectorAll('#services .card')).find(c=>c.dataset.service===focus.service);
  const bars=card?.querySelectorAll('.bar'),bar=bars?.[Math.min(focus.index,bars.length-1)];
  if(bar){bars.forEach(b=>b.tabIndex=-1);bar.tabIndex=0;bar.focus({preventScroll:true});if(!focus.tooltipVisible)hideTooltip()}
 }
}
const tooltip=document.querySelector('#graph-tooltip');
function hideTooltip(){tooltip.hidden=true;document.querySelector('[aria-describedby="graph-tooltip"]')?.removeAttribute('aria-describedby')}
function showTooltip(bar){
 hideTooltip();tooltip.textContent=bar.getAttribute('aria-label');tooltip.style.maxHeight=Math.max(1,innerHeight-16)+'px';tooltip.scrollTop=0;tooltip.hidden=false;bar.setAttribute('aria-describedby','graph-tooltip');
 const r=bar.getBoundingClientRect(),box=tooltip.getBoundingClientRect();
 const x=Math.max(8,Math.min(innerWidth-box.width-8,r.left+r.width/2-box.width/2));
 const preferredY=r.top-box.height-9>=8?r.top-box.height-9:r.bottom+9;
 const y=Math.max(8,Math.min(innerHeight-box.height-8,preferredY));
 tooltip.style.transform=`translate(${x}px,${y}px)`;
}
const services=document.querySelector('#services');
services.addEventListener('pointerover',e=>{const bar=e.target.closest('.bar');if(bar)showTooltip(bar)});
services.addEventListener('pointerout',e=>{if(e.pointerType!=='touch'&&e.target.closest('.bar')&&!tooltip.contains(e.relatedTarget)&&!document.activeElement?.matches('.bar'))hideTooltip()});
tooltip.addEventListener('pointerleave',e=>{if(!e.relatedTarget?.closest?.('.bar')&&!document.activeElement?.matches('.bar'))hideTooltip()});
services.addEventListener('focusin',e=>{if(e.target.matches('.bar'))showTooltip(e.target)});
services.addEventListener('focusout',hideTooltip);
services.addEventListener('keydown',e=>{
 const bar=e.target.closest('.bar');if(!bar)return;
 if(!tooltip.hidden&&(e.key==='PageDown'||e.key==='PageUp')){e.preventDefault();tooltip.scrollTop+=(e.key==='PageDown'?1:-1)*tooltip.clientHeight;return}
 const bars=Array.from(bar.parentElement.children),i=bars.indexOf(bar);
 const next=e.key==='ArrowRight'?Math.min(bars.length-1,i+1):e.key==='ArrowLeft'?Math.max(0,i-1):e.key==='Home'?0:e.key==='End'?bars.length-1:null;
 if(next!==null){e.preventDefault();bar.tabIndex=-1;bars[next].tabIndex=0;bars[next].focus()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTooltip()});
document.addEventListener('pointerdown',e=>{const bar=e.target.closest('.bar');if(bar)showTooltip(bar);else if(!tooltip.contains(e.target))hideTooltip()});
window.addEventListener('scroll',e=>{if(e.target!==tooltip){const bar=document.activeElement;if(bar?.matches('.bar'))showTooltip(bar);else hideTooltip()}},true);window.addEventListener('resize',hideTooltip);
async function load(){if(loading)return;loading=true;try{const r=await fetch('/api/status',{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error();data=await r.json();connected=true;render()}catch(e){connected=false;if(data){for(const s of data.services)s.state='unknown';render()}else{document.querySelector('#overall').className='overall warning';document.querySelector('#overall').textContent='상태 정보를 불러올 수 없어요'}}finally{loading=false}}load();setInterval(()=>{if(!document.hidden)load()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
</html>
